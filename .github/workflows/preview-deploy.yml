name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Vercel preview deployment
        id: deploy
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "hizamaru",
              "gitSource": {
                "type": "github",
                "ref": "${{ github.head_ref }}",
                "repoId": ${{ github.repository_id }}
              },
              "env": {
                "USE_IN_MEMORY_DB": "true"
              }
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Vercel API error"
            echo "$BODY" | jq . || echo "$BODY"
            exit 1
          fi

          DEPLOYMENT_ID=$(echo "$BODY" | jq -r '.id // empty')
          DEPLOYMENT_URL=$(echo "$BODY" | jq -r '.url // .deploymentUrl // empty')

          if [ -z "$DEPLOYMENT_ID" ] && [ -z "$DEPLOYMENT_URL" ]; then
            PREVIEW_URL="https://hizamaru-${{ github.head_ref }}.vercel.app"
          elif [ -n "$DEPLOYMENT_URL" ]; then
            PREVIEW_URL="https://$DEPLOYMENT_URL"
          else
            PREVIEW_URL="https://$DEPLOYMENT_ID-hizamaru.vercel.app"
          fi

          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $PREVIEW_URL"

      - name: Post or update preview comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            const pr = context.issue.number;
            const body = `🚀 Preview deployment ready!\n\n[Visit Preview](${previewUrl})`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });

            const botComment = comments.data.find(comment =>
              comment.body.includes('🚀 Preview deployment ready!')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body: body,
              });
            }
